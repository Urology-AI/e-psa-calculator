name: Security

# Layer 2 of the audit stack: runs on every change, before anything ships.
#   Layer 1 = .githooks/pre-push (blocks secrets at the developer's machine)
#   Layer 2 = this workflow
#   Layer 3 = security-nightly.yml (probes what is actually deployed)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the whole history — a secret committed and then
          # "removed" in a later commit is still published and still valid.
          fetch-depth: 0

      # Invoking the binary directly rather than gitleaks/gitleaks-action@v2:
      # that action requires a paid GITLEAKS_LICENSE for organization-owned
      # repos, and these live under the Urology-AI org. Same scanner, same
      # config, no licence gate.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  rules:
    name: Firestore + Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Firestore and Storage emulators are Java processes; firebase-tools
      # requires JDK 21 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        working-directory: security
        run: npm ci || npm install

      - name: Run rules tests
        working-directory: security
        run: npm test

  bundle:
    name: Built bundle contains no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # @epsa/engine resolves to the private @urology-ai/epsa-engine GitHub
      # Packages registry (npm: alias in package.json), so installing needs the
      # same auth firebase-deploy.yml sets up. Without it npm 404s and the scan
      # would have nothing to inspect.
      - name: Write .npmrc for private registry
        run: |
          echo "@urology-ai:registry=https://npm.pkg.github.com" > frontend/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${EPSA_ENGINE_DEPLOY_KEY}" >> frontend/.npmrc
        env:
          EPSA_ENGINE_DEPLOY_KEY: ${{ secrets.EPSA_ENGINE_DEPLOY_KEY }}

      # npm install, not npm ci: the lockfile predates the npm: alias switch,
      # same as the deploy workflow.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Remove local .npmrc
        if: always()
        run: rm -f frontend/.npmrc

      # scan-bundle.sh treats a missing or empty build directory as a failure,
      # so a broken build can never be mistaken for a clean scan.
      - name: Scan built output
        run: ./security/scan-bundle.sh frontend/build

  vite-exposure:
    name: No new browser-exposed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches the class of bug that never appears in git history: a
      # credential inlined into the bundle by a VITE_ prefix. Known, accepted
      # exposures are listed in security/vite-exposure-baseline.txt; anything
      # new fails the build.
      - name: Check for VITE_-prefixed secrets
        run: |
          ./security/check-vite-env.sh \
            frontend/src \
            frontend/.env.example \
            .github/workflows/firebase-deploy.yml

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Advisories appear independently of our changes. Report them in the log
      # but never fail the check — a red X here would train people to ignore
      # the whole workflow, including the checks that do gate merges.
      - name: npm audit (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high || true
