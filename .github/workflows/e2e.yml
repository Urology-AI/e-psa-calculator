name: e2e

# Full-stack browser tests: real UI + real scoring callable + Firestore, all in
# the Firebase emulators (no mocks, no production access). Runs on every PR and
# push to main, and every 6 hours so a regression in a dependency, the engine or
# the emulators shows up even when nobody is pushing.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Same private GitHub Packages auth as firebase-deploy.yml.
      - name: Write .npmrc for private registry
        run: |
          for d in frontend backend; do
            echo "@urology-ai:registry=https://npm.pkg.github.com" > $d/.npmrc
            echo "//npm.pkg.github.com/:_authToken=${EPSA_ENGINE_DEPLOY_KEY}" >> $d/.npmrc
          done
        env:
          EPSA_ENGINE_DEPLOY_KEY: ${{ secrets.EPSA_ENGINE_DEPLOY_KEY }}
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install backend
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: e2e (builds backend, starts emulators, runs Playwright)
        working-directory: frontend
        env:
          CI: 'true'
        run: node e2e/run.mjs
      - name: Remove .npmrc files
        if: always()
        run: rm -f frontend/.npmrc backend/.npmrc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
