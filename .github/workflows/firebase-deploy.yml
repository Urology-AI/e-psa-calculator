name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy_functions:
        description: 'Deploy functions even if this run detects no backend/ changes (e.g. to deploy a fix that already merged before this workflow existed)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy-functions:
    # Cloud Functions only — Hosting is deployed by build-and-deploy below.
    # Runs on push to main, or on-demand via workflow_dispatch (Actions tab →
    # this workflow → Run workflow). Skipped for PRs (functions have no
    # preview-channel equivalent to Hosting's, and deploying on every PR push
    # would be redundant with what merges to main).
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Skip the deploy (rather than fail it) when this push didn't touch backend/
    # or firebase.json — Cloud Functions deploys are slow and this workflow fires
    # on every push to main, most of which are frontend-only. Defaults to
    # deploying (safer than silently skipping) if the before-SHA is unusable —
    # e.g. all-zeros on a branch's first push, a history-rewriting push, or a
    # manual workflow_dispatch run (no before/after push SHAs at all) — the
    # force_deploy_functions input makes the manual-dispatch case explicit too.
    - name: Check whether backend changed
      id: changed
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_deploy_functions }}" = "true" ]; then
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        BEFORE_SHA="${{ github.event.before }}"
        if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
        elif git diff --quiet "$BEFORE_SHA" "${{ github.sha }}" -- backend firebase.json; then
          echo "backend_changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "backend_changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js
      if: steps.changed.outputs.backend_changed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: backend/package-lock.json

    # @urology-ai/epsa-engine is a private GitHub Packages registry dependency
    # (not the git+ssh dependency the frontend job below still uses). This
    # .npmrc has to travel into backend/lib/ (done by `npm run build`'s copy
    # step) because Firebase's Cloud Functions deploy re-runs npm install on
    # Google's own remote build infrastructure using only what got uploaded —
    # local git/SSH auth from this runner never reaches that step, but a
    # registry token baked into .npmrc does.
    - name: Write .npmrc for private registry
      if: steps.changed.outputs.backend_changed == 'true'
      run: |
        echo "@urology-ai:registry=https://npm.pkg.github.com" > backend/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${EPSA_ENGINE_DEPLOY_KEY}" >> backend/.npmrc
      env:
        EPSA_ENGINE_DEPLOY_KEY: ${{ secrets.EPSA_ENGINE_DEPLOY_KEY }}

    # npm install, not npm ci: package-lock.json doesn't yet have an entry for
    # @urology-ai/epsa-engine (no environment with registry read access was
    # available to regenerate it when the dependency was switched from the
    # git+ssh URL). Lock-file reproducibility doesn't protect anything here
    # anyway — Google's Cloud Functions build reinstalls everything from
    # scratch on its own infrastructure regardless of what this step produces.
    - name: Install dependencies
      if: steps.changed.outputs.backend_changed == 'true'
      run: npm install
      working-directory: backend

    # Phase 1 success criterion: backend output must stay identical to a
    # direct @urology-ai/epsa-engine call. Run before the deploy build so a
    # regression here blocks the deploy, not just gets noticed after the fact.
    - name: Run backend tests
      if: steps.changed.outputs.backend_changed == 'true'
      run: npm test
      working-directory: backend

    - name: Build (tsc + vendor copy)
      if: steps.changed.outputs.backend_changed == 'true'
      run: npm run build
      working-directory: backend

    - name: Remove local .npmrc
      if: always() && steps.changed.outputs.backend_changed == 'true'
      run: rm -f backend/.npmrc

    # firebase-tools reads GOOGLE_APPLICATION_CREDENTIALS as a file path, not a
    # JSON blob directly, so the secret has to be written to disk first. Uses
    # runner temp (not the repo checkout) and is removed in the following step
    # regardless of deploy outcome.
    - name: Write service account credentials
      if: steps.changed.outputs.backend_changed == 'true'
      run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
      env:
        FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}

    # Scoped to these two stateless, secret-free functions only, not the whole
    # functions/ codebase (~30 functions including sendAdminOTP, submitRedcap,
    # session management, etc). Deploying everything would need the CI service
    # account granted secretmanager.secrets.get across every secret those other
    # functions use (OTP email credentials among them) — broader access than a
    # CI bot deploying a couple of stateless calculators should have. Widen this
    # deliberately, with its own IAM review, if/when CI needs to deploy the rest
    # of backend/.
    - name: Deploy functions
      if: steps.changed.outputs.backend_changed == 'true'
      run: npx firebase-tools deploy --only functions:calculatePsaRecommendation,functions:predictBiopsyRisk --project epsa-30d0b --non-interactive
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

    - name: Remove service account credentials
      if: always() && steps.changed.outputs.backend_changed == 'true'
      run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # @epsa/engine now resolves to the @urology-ai/epsa-engine GitHub Packages
    # registry package (npm: alias in package.json), not a git+ssh clone —
    # same private-registry auth pattern as backend's step above, reusing the
    # same deploy key secret (it already grants read:packages).
    - name: Write .npmrc for private registry
      run: |
        echo "@urology-ai:registry=https://npm.pkg.github.com" > frontend/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${EPSA_ENGINE_DEPLOY_KEY}" >> frontend/.npmrc
      env:
        EPSA_ENGINE_DEPLOY_KEY: ${{ secrets.EPSA_ENGINE_DEPLOY_KEY }}

    # npm install, not npm ci: package-lock.json doesn't yet have an entry
    # reflecting the npm: alias switch (no environment with registry read
    # access was available locally to regenerate it) — same situation as
    # backend's install step above.
    - name: Install dependencies
      run: npm install
      working-directory: frontend

    - name: Remove local .npmrc
      if: always()
      run: rm -f frontend/.npmrc

    - name: Build
      run: npm run build
      working-directory: frontend
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

    # No VITE_FIREBASE_* here on purpose: this build has no Firebase, no
    # accounts, and no network calls at all. Passing credentials it cannot use
    # would only put them in a bundle served to anonymous public traffic.
    - name: Build Sinai landing-page bundle
      run: npm run build:sinai
      working-directory: frontend

    # repoToken is deliberately NOT passed to the deploy action: with a token it
    # calls the GitHub check-runs/comments API and any API hiccup crashes the
    # whole job even when the Firebase deploy succeeded.
    # Also runs on workflow_dispatch, not just push — otherwise a manual dispatch
    # (e.g. to deploy a fix that already merged before this workflow existed, or
    # to redeploy without a new push) builds successfully but the live site
    # silently keeps serving the previous bundle, since this was the only step
    # that actually publishes it. Found the hard way: deploy-functions' own
    # workflow_dispatch support gave no indication hosting wasn't also shipping.
    - name: Deploy (live)
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        channelId: live
        projectId: epsa-30d0b
        target: app

    - name: Deploy Sinai landing page (live)
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        channelId: live
        projectId: epsa-30d0b
        target: sinai

    - name: Skip preview deploy for fork PRs
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: echo 'Skipping Firebase preview deploy for fork PR because secrets are unavailable.'

    - name: Deploy (preview)
      id: app_preview
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        projectId: epsa-30d0b
        target: app

    # The preview channel is how the Sinai web team and department reviewers
    # see a change before it is live: every PR gets its own expiring URL,
    # commented below, with nothing to install and no account needed.
    - name: Deploy Sinai landing page (preview)
      id: sinai_preview
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        projectId: epsa-30d0b
        target: sinai

    - name: Publish preview URL
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APP_URLS: ${{ steps.app_preview.outputs.urls }}
        SINAI_URLS: ${{ steps.sinai_preview.outputs.urls }}
        EXPIRES: ${{ steps.app_preview.outputs.expire_time }}
      run: |
        APP=$(echo "$APP_URLS" | jq -r 'join(" ")' 2>/dev/null || echo "$APP_URLS")
        SINAI=$(echo "$SINAI_URLS" | jq -r 'join(" ")' 2>/dev/null || echo "$SINAI_URLS")
        BODY="Preview URLs for commit ${{ github.event.pull_request.head.sha }}:

        - App: ${APP}
        - Sinai landing page: ${SINAI}

        Expires: ${EXPIRES}"
        echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
        gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$BODY" \
          || echo "PR comment failed; preview URL is in the job summary above."
