name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        VITE_CLINICAL_ADMIN_PIN: ${{ secrets.VITE_CLINICAL_ADMIN_PIN }}
        VITE_TURSO_URL: ${{ secrets.VITE_TURSO_URL }}
        VITE_TURSO_AUTH_TOKEN: ${{ secrets.VITE_TURSO_AUTH_TOKEN }}
        
    - name: Install admin-dashboard dependencies
      run: |
        cd admin-dashboard
        npm install
        
    - name: Build admin-dashboard
      run: |
        cd admin-dashboard
        npm run build
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

    # repoToken is deliberately NOT passed to the deploy action: with a token it
    # calls the GitHub check-runs/comments API and any API hiccup crashes the
    # whole job even when the Firebase deploy succeeded. Preview URLs are
    # posted by the best-effort comment step below instead.
    - name: Deploy app (live)
      if: ${{ github.event_name == 'push' }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        channelId: live
        projectId: epsa-30d0b
        target: app

    - name: Deploy admin (live)
      if: ${{ github.event_name == 'push' }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        channelId: live
        projectId: epsa-30d0b
        target: admin

    - name: Skip preview deploy for fork PRs
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      run: echo 'Skipping Firebase preview deploy for fork PR because secrets are unavailable.'

    - name: Deploy app (preview)
      id: app_preview
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        projectId: epsa-30d0b
        target: app

    - name: Deploy admin (preview)
      id: admin_preview
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EPSA_30D0B }}'
        projectId: epsa-30d0b
        target: admin

    - name: Publish preview URLs (summary + best-effort PR comment)
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APP_URLS: ${{ steps.app_preview.outputs.urls }}
        ADMIN_URLS: ${{ steps.admin_preview.outputs.urls }}
        EXPIRES: ${{ steps.app_preview.outputs.expire_time }}
      run: |
        # outputs.urls is a JSON array string — flatten to space-separated links
        APP=$(echo "$APP_URLS" | jq -r 'join(" ")' 2>/dev/null || echo "$APP_URLS")
        ADMIN=$(echo "$ADMIN_URLS" | jq -r 'join(" ")' 2>/dev/null || echo "$ADMIN_URLS")
        BODY="Preview URLs for commit ${{ github.event.pull_request.head.sha }}:

        - App: ${APP}
        - Admin: ${ADMIN}

        Expires: ${EXPIRES}"
        echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
        gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$BODY" \
          || echo "PR comment failed (GitHub API unavailable); preview URLs are in the job summary above."
