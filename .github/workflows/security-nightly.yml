name: Security nightly

# Layer 3: probe the DEPLOYED Firebase project.
#
# The rules tests in security/ prove firestore.rules and storage.rules are
# correct. They cannot prove those files are what is currently live — a console
# edit, a partial deploy, or a rollback all leave the repo green while
# production is open. This signs in anonymously, exactly as a visitor could,
# and checks production itself.

on:
  schedule:
    # 03:00 UTC ≈ 23:00 US Eastern — the "end of the day" check.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe deployed Firebase project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe production
        env:
          # Public Web API key — identifies the project, authorizes nothing.
          # Stored as a secret only because this repo already keeps it there.
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'epsa-30d0b' }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://epsa-30d0b.web.app' }}
        run: |
          set -o pipefail
          node security/probe-production.mjs 2>&1 | tee probe-output.txt

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'probe produced no output';
            try { output = fs.readFileSync('probe-output.txt', 'utf8'); } catch {}

            const title = 'Nightly security probe failed (Firebase project)';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-probe',
            });

            const body = [
              `Probe run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'If Firestore or Storage checks failed, redeploy the rules:',
              '',
              '    firebase deploy --only firestore:rules,storage',
              '',
              '```',
              output.slice(0, 60000),
              '```',
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['security-probe'],
                body,
              });
            }
